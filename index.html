<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LP Tracker</title>
<meta name="description" content="Позиции Uniswap и PancakeSwap прямо из блокчейна: диапазоны, комиссии, PnL, график и пулы монеты.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311161d'/%3E%3Crect x='10' y='30' width='9' height='20' rx='2' fill='%234c8dff'/%3E%3Crect x='23' y='22' width='9' height='28' rx='2' fill='%2334d399'/%3E%3Crect x='36' y='34' width='9' height='16' rx='2' fill='%234c8dff'/%3E%3Crect x='8' y='26' width='48' height='3' rx='1.5' fill='%23f5c84b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--panel-2)"/><rect x="10" y="30" width="9" height="20" rx="2" fill="var(--blue)"/><rect x="23" y="22" width="9" height="28" rx="2" fill="var(--green)"/><rect x="36" y="34" width="9" height="16" rx="2" fill="var(--blue)"/><rect x="8" y="26" width="48" height="3" rx="1.5" fill="var(--price)"/></svg>
      <span>LP Tracker</span>
    </div>
    <nav id="wallet-tabs" class="tabs" aria-label="Кошельки"></nav>
    <div class="top-right">
      <span id="status" class="status" aria-live="polite"></span>
      <button id="refresh" class="icon-btn" type="button" title="Обновить сейчас" aria-label="Обновить сейчас">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="wallets-btn" class="icon-btn" type="button" title="Кошельки" aria-label="Кошельки">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7Zm0 0V6a2 2 0 0 1 2-2h11v3M16 13.5h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="summary" class="summary" aria-label="Итоги"></section>
  <div class="layout">
    <section id="groups" class="groups" aria-label="Позиции"></section>
    <aside id="detail" class="detail" aria-label="Подробности">
      <div id="d-head"></div>
      <div class="panel" id="chart-panel" hidden>
        <div id="chart-bar" class="chart-bar"></div>
        <div class="chart"><div id="chart" class="chart-host"></div><div id="chart-msg" class="chart-msg">Загружаю свечи…</div></div>
        <span class="faint">Свечи: GeckoTerminal · жёлтая линия — текущая цена, пунктир — границы позиций (зелёные — цена внутри) · ↕ — показать все диапазоны</span>
      </div>
      <div id="d-positions"></div>
      <div id="d-pools"></div>
    </aside>
  </div>
  <p id="note" class="note"></p>
</main>

<dialog id="wallets-dialog" class="dialog">
  <form id="wallet-form" class="dialog-body">
    <h2>Кошельки</h2>
    <p class="muted">Адреса хранятся только в этом браузере. Сайт ничего никуда не отправляет, кроме запросов к блокчейну и публичным API.</p>
    <ul id="wallet-list" class="wallet-list"></ul>
    <div class="add-row">
      <label class="field"><span>Имя</span><input id="w-name" autocomplete="off" placeholder="Например, MAX"></label>
      <label class="field grow"><span>Адрес</span><input id="w-address" autocomplete="off" spellcheck="false" placeholder="0x…"></label>
      <button id="w-add" class="btn" type="submit">Добавить</button>
    </div>
    <p id="w-error" class="error" hidden></p>
    <div class="dialog-foot"><button id="w-close" class="btn ghost" type="button">Готово</button></div>
  </form>
</dialog>

<script src="vendor/ethers.umd.min.js?v=6.13.2"></script>
<script src="vendor/lightweight-charts.standalone.production.js?v=4.2.0"></script>
<script src="chain.js"></script>
<script src="app.js?v=20261030-1"></script>
</body>
</html>
